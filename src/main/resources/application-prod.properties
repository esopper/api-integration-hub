# src/main/resources/application-prod.properties
# Active when SPRING_PROFILES_ACTIVE=prod (set in systemd service on Lightsail)

# Pull secrets from AWS Secrets Manager at startup.
# The secret at this path should be a JSON object with keys matching property names:
# {
#   "github.token": "...",
#   "openweather.api.key": "..."
# }
spring.config.import=aws-secretsmanager:api-integration-hub/prod

app.cors.allowed-origins=https://eriksopper.com
