# src/main/resources/application.properties
spring.application.name=api-integration-hub
server.port=${PORT:8080}

# Local default — overridden in application-prod.properties
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200}

# Populated by env vars locally, by Secrets Manager in prod (via application-prod.properties)
github.token=${GITHUB_TOKEN:}
openweather.api.key=${OPENWEATHER_API_KEY:}
